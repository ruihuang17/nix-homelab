name: deploy

# Manually triggered deploy over Tailscale. Never add a pull_request or push
# trigger without thinking: this job holds credentials that can change
# production.
on:
  workflow_dispatch:
    inputs:
      satsuma:
        description: Deploy satsuma
        type: boolean
        default: true
      bergamot:
        description: Deploy bergamot
        type: boolean
        default: true
      pomelo:
        description: Deploy pomelo (must be powered on)
        type: boolean
        default: false
      lime:
        description: Deploy lime (nix-darwin)
        type: boolean
        default: false
      tangerine:
        description: Deploy tangerine (laptop, must be awake)
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SATSUMA_HOST_KEY: ${{ secrets.SATSUMA_HOST_KEY }}
          HOSTS: >-
            ${{ inputs.satsuma && 'satsuma' || '' }}
            ${{ inputs.bergamot && 'bergamot' || '' }}
            ${{ inputs.pomelo && 'pomelo' || '' }}
            ${{ inputs.lime && 'lime' || '' }}
            ${{ inputs.tangerine && 'tangerine' || '' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SATSUMA_HOST_KEY" > ~/.ssh/known_hosts
          HOSTS=$(echo $HOSTS)
          [ -n "$HOSTS" ] || { echo "no hosts selected" >&2; exit 1; }
          # The key is forced to run ci-deploy; it takes the host list as its argument.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            root@100.72.25.50 "$HOSTS"
